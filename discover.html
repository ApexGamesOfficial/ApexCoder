<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ApexCoder | Discover</title>

    <link
        rel="stylesheet"
        href="discover.css?v=1"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="auth.js"
        defer
    ></script>

    <script
        src="discover.js?v=1"
        defer
    ></script>
</head>

<body>

    <div class="app-shell">

        <aside class="sidebar">

            <button
                class="account-card"
                id="accountCard"
                type="button"
            >
                <img
                    src="Default Apex Games Profile Picture.png"
                    alt="Profile Picture"
                    class="account-avatar"
                    id="accountAvatar"
                >

                <div class="account-info">

                    <span
                        class="account-gamertag"
                        id="accountGamertag"
                    >
                        Loading...
                    </span>

                    <span class="account-label">
                        Apex Games Account
                    </span>

                </div>
            </button>


            <nav class="sidebar-nav">

                <a
                    href="dashboard.html"
                    class="sidebar-link"
                >
                    <span class="sidebar-dot"></span>
                    Home
                </a>

                <a
                    href="projects.html"
                    class="sidebar-link"
                >
                    <span class="sidebar-dot"></span>
                    Projects
                </a>

                <a
                    href="discover.html"
                    class="sidebar-link active"
                >
                    <span class="sidebar-dot"></span>
                    Discover
                </a>

                <a
                    href="chat.html"
                    class="sidebar-link"
                >
                    <span class="sidebar-dot"></span>
                    Chat
                </a>

                <a
                    href="subscriptions.html"
                    class="sidebar-link"
                >
                    <span class="sidebar-dot"></span>
                    Subscriptions
                </a>

                <a
                    href="settings.html"
                    class="sidebar-link"
                >
                    <span class="sidebar-dot"></span>
                    Settings
                </a>

            </nav>

        </aside>


        <main class="main-content">

            <header class="discover-header">

                <div>

                    <p class="eyebrow">
                        COMMUNITY
                    </p>

                    <h1>
                        Discover
                    </h1>

                    <p class="header-description">
                        Explore projects built by the ApexCoder community.
                    </p>

                </div>

            </header>


            <section class="discover-tools">

                <div class="filter-tabs">

                    <button
                        class="filter-tab active"
                        type="button"
                        data-filter="all"
                    >
                        All
                    </button>

                    <button
                        class="filter-tab"
                        type="button"
                        data-filter="game"
                    >
                        Games
                    </button>

                    <button
                        class="filter-tab"
                        type="button"
                        data-filter="website"
                    >
                        Websites
                    </button>

                    <button
                        class="filter-tab"
                        type="button"
                        data-filter="malware"
                    >
                        Sandbox
                    </button>

                </div>


                <div class="search-wrap">

                    <input
                        type="search"
                        id="discoverSearch"
                        placeholder="Search community projects..."
                        autocomplete="off"
                    >

                </div>

            </section>


            <section class="featured-section">

                <div class="section-heading">

                    <div>

                        <p class="section-label">
                            FEATURED
                        </p>

                        <h2>
                            Featured Projects
                        </h2>

                    </div>

                </div>


                <div
                    class="project-grid"
                    id="projectGrid"
                >
                </div>

            </section>


            <div
                class="empty-state"
                id="emptyState"
                hidden
            >
                <h2>
                    No projects found.
                </h2>

                <p>
                    Try another search or category.
                </p>
            </div>

        </main>

    </div>

</body>
</html>
