<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ApexCoder | Chat</title>

<link
    rel="stylesheet"
   href="./chat.css?v=1001"
>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>

    <div class="app-shell">


        <!-- =====================================
             APEXCODER SIDEBAR
        ====================================== -->

        <!-- =========================
     SIDEBAR
========================== -->

<aside class="sidebar">

    <button
        class="account-card"
        id="accountCard"
        type="button"
    >
        <img
            src="Default Apex Games Profile Picture.png"
            alt="Profile Picture"
            class="account-avatar"
            id="accountAvatar"
        >

        <div class="account-info">

            <span
                class="account-gamertag"
                id="accountGamertag"
            >
                Loading...
            </span>

            <span class="account-label">
                Apex Games Account
            </span>

        </div>
    </button>


    <nav class="sidebar-nav">

        <a
            href="dashboard.html"
            class="sidebar-link"
        >
            <span class="sidebar-dot"></span>
            Home
        </a>

        <a
            href="projects.html"
            class="sidebar-link"
        >
            <span class="sidebar-dot"></span>
            Projects
        </a>

        <a
            href="discover.html"
            class="sidebar-link"
        >
            <span class="sidebar-dot"></span>
            Discover
        </a>

        <a
            href="chat.html"
            class="sidebar-link active"
        >
            <span class="sidebar-dot"></span>
            Chat
        </a>

        <a
            href="subscriptions.html"
            class="sidebar-link"
        >
            <span class="sidebar-dot"></span>
            Subscriptions
        </a>

        <a
            href="settings.html"
            class="sidebar-link"
        >
            <span class="sidebar-dot"></span>
            Settings
        </a>

    </nav>

</aside>


        <!-- =====================================
             FRIEND SIDEBAR
        ====================================== -->

        <aside class="friends-sidebar">

            <div class="friends-header">

                <div>

                    <p class="section-label">
                        APEXCODER
                    </p>

                    <h1>
                        Chat
                    </h1>

                </div>

                <button
                    class="header-action"
                    type="button"
                    id="newChatButton"
                    title="New conversation"
                >
                    +
                </button>

            </div>


            <div class="friend-search">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    type="search"
                    id="friendSearch"
                    placeholder="Search friends..."
                    autocomplete="off"
                >

            </div>


            <div class="friends-section-title">

                <span>
                    Friends
                </span>

                <span
                    id="friendCount"
                    class="friend-count"
                >
                    0
                </span>

            </div>


            <div
                class="friends-list"
                id="friendsList"
            >

                <div class="sidebar-loading">
                    Loading friends...
                </div>

            </div>

        </aside>



        <!-- =====================================
             CONVERSATION AREA
        ====================================== -->

        <main class="conversation-area">


            <!-- EMPTY STATE -->

            <section
                class="conversation-empty"
                id="conversationEmpty"
            >

                <div class="empty-glow">

                    <div class="empty-logo">
                        &lt;/&gt;
                    </div>

                </div>


                <h2>
                    Your conversations
                </h2>

                <p>
                    Choose a friend from the sidebar to start chatting.
                </p>

                <div class="empty-feature-row">

                    <div>
                        <span>💬</span>
                        Messages
                    </div>

                    <div>
                        <span>😀</span>
                        Emoji
                    </div>

                    <div>
                        <span>GIF</span>
                        GIFs
                    </div>

                    <div>
                        <span>🎙</span>
                        Voice
                    </div>

                </div>

            </section>



            <!-- ACTIVE CONVERSATION -->

            <section
                class="conversation"
                id="conversation"
                hidden
            >


                <!-- HEADER -->

                <header class="conversation-header">

                    <div class="conversation-person">

                        <div class="conversation-avatar-wrap">

                            <img
                                id="conversationAvatar"
                                class="conversation-avatar"
                                src="Default Apex Games Profile Picture.png"
                                alt="Friend"
                            >

                            <span
                                id="conversationStatus"
                                class="presence-dot offline"
                            ></span>

                        </div>


                        <div class="conversation-person-info">

                            <h2
                                id="conversationName"
                            >
                                Friend
                            </h2>

                            <span
                                id="conversationStatusText"
                                class="conversation-presence"
                            >
                                Offline
                            </span>

                        </div>

                    </div>


                    <div class="conversation-actions">

                        <button
                            id="voiceCallButton"
                            class="conversation-action"
                            type="button"
                            title="Voice call"
                        >
                            📞
                        </button>


                        <button
                            id="conversationMoreButton"
                            class="conversation-action"
                            type="button"
                            title="More options"
                        >
                            •••
                        </button>

                    </div>

                </header>



                <!-- MESSAGES -->

                <div
                    class="messages"
                    id="messages"
                ></div>



                <!-- FEATURE NOTICE -->

                <div
                    class="feature-notice"
                    id="featureNotice"
                    hidden
                >

                    <span
                        id="featureNoticeText"
                    ></span>

                    <button
                        id="closeFeatureNotice"
                        type="button"
                    >
                        ×
                    </button>

                </div>



                <!-- EMOJI PICKER -->

                <div
                    class="emoji-picker"
                    id="emojiPicker"
                    hidden
                >

                    <div class="emoji-picker-header">

                        <strong>
                            Emoji
                        </strong>

                        <span>
                            Pick one
                        </span>

                    </div>


                    <div
                        class="emoji-grid"
                        id="emojiGrid"
                    ></div>

                </div>



                <!-- MESSAGE BAR -->

                <div class="message-composer">

                    <div class="composer-tools">

                        <button
                            id="emojiButton"
                            class="composer-tool"
                            type="button"
                            title="Emoji"
                        >
                            😀
                        </button>


                        <button
                            id="gifButton"
                            class="composer-tool gif-tool"
                            type="button"
                            title="GIF"
                        >
                            GIF
                        </button>


                        <button
                            id="voiceButton"
                            class="composer-tool"
                            type="button"
                            title="Voice message"
                        >
                            🎙
                        </button>

                    </div>


                    <form
                        class="message-form"
                        id="messageForm"
                    >

                        <textarea
                            id="messageInput"
                            rows="1"
                            maxlength="2000"
                            placeholder="Message..."
                        ></textarea>


                        <button
                            id="sendButton"
                            class="send-button"
                            type="submit"
                            disabled
                        >
                            Send
                        </button>

                    </form>

                </div>


            </section>

        </main>

    </div>


    <script
        src="auth.js"
        defer
    ></script>

    <script
        src="presence.js?v=1"
        defer
    ></script>

   <script src="chat.js?v=999" defer></script>

</body>

</html>
