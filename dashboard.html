<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ApexCoder | Home</title>

    <link
        rel="stylesheet"
        href="dashboard.css?v=2"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="auth.js"
        defer
    ></script>

   <script src="dashboard.js?v=3" defer></script>
</head>

<body>

    <div class="app-shell">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <button
                class="account-card"
                id="accountCard"
                type="button"
            >
                <img
                    src="Default Apex Games Profile Picture.png"
                    alt="Profile Picture"
                    class="account-avatar"
                    id="accountAvatar"
                >

                <div class="account-info">

                    <span
                        class="account-gamertag"
                        id="accountGamertag"
                    >
                        Loading...
                    </span>

                    <span class="account-label">
                        Apex Games Account
                    </span>

                </div>
            </button>


            <nav class="sidebar-nav">

                <a
                    href="dashboard.html"
                    class="sidebar-link active"
                >
                    <span class="sidebar-dot"></span>
                    Home
                </a>

                <a
                    href="projects.html"
                    class="sidebar-link"
                >
                    <span class="sidebar-dot"></span>
                    Projects
                </a>

                <a
                    href="discover.html"
                    class="sidebar-link"
                >
                    <span class="sidebar-dot"></span>
                    Discover
                </a>

                <a
                    href="chat.html"
                    class="sidebar-link"
                >
                    <span class="sidebar-dot"></span>
                    Chat
                </a>

                <a
                    href="subscriptions.html"
                    class="sidebar-link"
                >
                    <span class="sidebar-dot"></span>
                    Subscriptions
                </a>

                <a
                    href="settings.html"
                    class="sidebar-link"
                >
                    <span class="sidebar-dot"></span>
                    Settings
                </a>

            </nav>

        </aside>


        <!-- =========================
             MAIN
        ========================== -->

        <main class="main-content">

            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    &lt;/&gt;
                </div>

                <span>
                    ApexCoder
                </span>

            </div>


            <!-- WELCOME -->

            <section class="welcome">

                <h1>
                    Welcome,
                    <span id="welcomeName">
                        Developer
                    </span>
                </h1>

                <p>
                    What are you working on today?
                </p>

            </section>


            <!-- =====================
                 GAMES
            ====================== -->

            <section class="project-section">

                <div class="section-heading">

                    <div>
                        <p class="section-label">
                            PROJECTS
                        </p>

                        <h2>
                            Your Games
                        </h2>
                    </div>

                    <a
                        href="projects.html?type=game"
                        class="view-all"
                    >
                        View All
                    </a>

                </div>


                <div
                    class="project-row"
                    id="gamesProjects"
                >

                    <button
                        class="project-card new-project-card"
                        type="button"
                        data-project-type="game"
                    >
                        <span class="project-plus">
                            +
                        </span>

                        <span class="project-name">
                            New Game
                        </span>

                        <span class="project-description">
                            Start a new game project.
                        </span>
                    </button>

                </div>

            </section>


            <!-- =====================
                 WEBSITES
            ====================== -->

            <section class="project-section">

                <div class="section-heading">

                    <div>
                        <p class="section-label">
                            PROJECTS
                        </p>

                        <h2>
                            Your Websites
                        </h2>
                    </div>

                    <a
                        href="projects.html?type=website"
                        class="view-all"
                    >
                        View All
                    </a>

                </div>


                <div
                    class="project-row"
                    id="websiteProjects"
                >

                    <button
                        class="project-card new-project-card"
                        type="button"
                        data-project-type="website"
                    >
                        <span class="project-plus">
                            +
                        </span>

                        <span class="project-name">
                            New Website
                        </span>

                        <span class="project-description">
                            Start a new website project.
                        </span>
                    </button>

                </div>

            </section>


            <!-- =====================
                 MALWARE SANDBOX
            ====================== -->

            <section class="project-section">

                <div class="section-heading">

                    <div>
                        <p class="section-label">
                            PROJECTS
                        </p>

                        <h2>
                            Your Malware
                        </h2>
                    </div>

                    <a
                        href="projects.html?type=malware"
                        class="view-all"
                    >
                        View All
                    </a>

                </div>


                <div
                    class="project-row"
                    id="malwareProjects"
                >

                    <button
                        class="project-card new-project-card sandbox-card"
                        type="button"
                        data-project-type="malware"
                    >
                        <span class="project-plus">
                            +
                        </span>

                        <span class="project-name">
                            New Malware
                        </span>

                        <span class="project-description">
                            Create inside an isolated learning sandbox.
                        </span>
                    </button>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
